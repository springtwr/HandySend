[package]
name = "localsend_ohrs_tests"
version = "0.1.0"
edition = "2021"
description = "HandySend 桥接集成测试——通过桥接层 API 验证胶接逻辑"

[dependencies]
localsend_core = { path = "..", default-features = false }
localsend = { path = "../third_party/localsend/packages/core", features = ["crypto", "discovery", "http", "multicast"] }
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
tokio-stream = "0.1"
serde_json = "1"
anyhow = "1"
bytes = "1"
# MTA 失败收尾用例：以 fcntl(F_GETFD) 直接断言 fd 是否已被关闭（host Linux）
libc = "0.2"
futures-util = { version = "0.3", features = ["sink"] }
sha2 = "0.10"
# MTA 集成用例：以内存流模拟对端 WS 连接，验证发送端状态机的终止路径
tokio-tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
rcgen = { version = "0.14", default-features = false, features = ["crypto", "pem", "ring"] }
tracing-subscriber = "0.3"
uuid = { version = "1", features = ["v4"] }
