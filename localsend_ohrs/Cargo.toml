[package]
name = "localsend_core"
version = "1.18.1"
edition = "2021"
description = "LocalSend Rust core NAPI bridge for HarmonyOS"

[lib]
crate-type = ["cdylib", "lib"]
path = "rust/lib.rs"

[features]
default = ["napi"]
napi = ["dep:napi-ohos", "dep:napi-derive-ohos", "dep:napi-build-ohos", "dep:tracing-log"]

[dependencies]
localsend = { path = "third_party/localsend/packages/core", features = ["crypto", "discovery", "http", "multicast"] }

napi-ohos = { version = "1.2", default-features = false, features = [
  "napi6",
  "serde-json",
  "tokio",
  "async",
  "tokio_rt",
  "tokio_macros",
  "error_anyhow",
], optional = true }
napi-derive-ohos = { version = "1.2", optional = true }

anyhow = "1"
# 仅用于 Web 分享下载路径的 libc::dup（复制 fd 副本供单次下载消费）
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
log = "0.4"
thiserror = "1"

if-addrs = "0.15"
tracing-log = { version = "0.2", optional = true }

x509-parser = "0.16"
sha2 = "0.10"
hex = "0.4"
bytes = "1"
futures-util = { version = "0.3", features = ["sink"] }

uuid = { version = "1", features = ["v4"] }

# ── MTA 发送端 TLS/WS/ZIP 服务器依赖 ──
# 单 TLS 端口同时承载 WebSocket 升级与 HTTPS 下载；证书复用核心 rcgen 运行时生成。
hyper = { version = "1", default-features = false, features = ["server", "http1"] }
hyper-util = { version = "0.1", default-features = false, features = ["tokio"] }
http-body = "1"
http-body-util = "0.1"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-pemfile = "1"
tokio-tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
# time 特性用于按源文件修改时间构造 ZIP 条目时间（MTA 链路唯一可承载文件时间的标准位）
zip = { version = "2", default-features = false, features = ["deflate", "time"] }
time = { version = "0.3", features = ["formatting", "parsing"] }

[build-dependencies]
napi-build-ohos = { version = "1.2", optional = true }

[profile.release]
lto = true
opt-level = "s"
strip = true
