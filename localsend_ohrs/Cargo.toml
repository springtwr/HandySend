[package]
name = "localsend_core"
version = "1.18.1"
edition = "2021"
description = "LocalSend Rust core NAPI bridge for HarmonyOS"

[lib]
crate-type = ["cdylib", "lib"]
path = "rust/lib.rs"

[features]
default = ["napi"]
napi = ["dep:napi-ohos", "dep:napi-derive-ohos", "dep:napi-build-ohos", "dep:if-addrs", "dep:tracing-log", "dep:uuid"]

[dependencies]
localsend = { path = "third_party/localsend/packages/core", features = ["crypto", "discovery", "http", "multicast"] }

napi-ohos = { version = "1.2", default-features = false, features = [
  "napi6",
  "serde-json",
  "tokio",
  "async",
  "tokio_rt",
  "tokio_macros",
  "error_anyhow",
], optional = true }
napi-derive-ohos = { version = "1.2", optional = true }

anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
log = "0.4"

if-addrs = { version = "0.15", optional = true }
tracing-log = { version = "0.2", optional = true }

x509-parser = "0.16"
sha2 = "0.10"
hex = "0.4"
bytes = "1"
futures-util = { version = "0.3", features = ["sink"] }

uuid = { version = "1", features = ["v4"], optional = true }

[build-dependencies]
napi-build-ohos = { version = "1.2", optional = true }

[profile.release]
lto = true
opt-level = "s"
strip = true
