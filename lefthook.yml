# Lefthook 配置 — HandySend 项目 Git Hooks
# 文档：https://lefthook.dev/configuration/

# 可使用lefthook.local进行覆盖
rc: ./.lefthookrc

# ============================================================
# pre-commit：提交前检查（暂存文件级别）
# ============================================================
pre-commit:
  parallel: true
  jobs:
    # --- 大文件检测 ---
    - name: 大文件检测
      run: |
        max_size=512  # KB
        large_files=""
        # 用 git 命令获取暂存文件，避免模板分词的边缘情况
        for file in $(git diff --cached --name-only); do
          if [ -f "$file" ]; then
            size=$(du -k "$file" 2>/dev/null | cut -f1)
            if [ -n "$size" ] && [ "$size" -gt "$max_size" ]; then
              large_files="$large_files\n$file (${size}KB)"
            fi
          fi
        done
        if [ -n "$large_files" ]; then
          echo "❌ 检测到大文件（>${max_size}KB）："
          echo -e "$large_files"
          echo "如确需提交，使用 LEFTHOOK_EXCLUDE=大文件检测 git commit 精确跳过"
          exit 1
        fi

    # --- 敏感信息扫描 ---
    - name: 敏感信息扫描
      run: |
        if ! command -v gitleaks &>/dev/null; then
          echo "❌ gitleaks 未安装，拒绝提交（安全检查不可跳过）"
          echo "   安装：https://github.com/gitleaks/gitleaks"
          exit 1
        fi
        gitleaks git --staged .

    # --- ArkTS 静态检查 ---
    # 注意：codelinter 的 --exit-on（-e）在当前版本失效，检出 error 时退出码仍为 0，
    # 因此不依赖退出码判定，改为解析 json 报告统计 error 级别问题。
    - name: ArkTS 静态检查
      glob: "**/*.ets"
      run: |
        if ! command -v codelinter &>/dev/null; then
          echo "⚠️  未找到 codelinter，跳过 ArkTS 检查"
          exit 0
        fi
        if ! command -v node &>/dev/null; then
          echo "⚠️  未找到 node，无法解析检查报告，跳过 ArkTS 检查"
          exit 0
        fi
        report=./temp/code-linter-report.json
        mkdir -p ./temp
        rm -f "$report"
        # 增量检查 Git 变更中的 .ets 文件（-i）；退出码不可信，仅用于判断执行是否成功
        lint_exit=0
        codelinter -f json -o "$report" -i . || lint_exit=$?
        if [ ! -f "$report" ]; then
          if [ "$lint_exit" -ne 0 ]; then
            echo "❌ codelinter 执行失败（退出码 $lint_exit），ArkTS 检查未生效，拒绝提交"
            exit 1
          fi
          echo "ℹ️  无待检查的增量 .ets 文件，跳过 ArkTS 检查"
          exit 0
        fi
        # 用 Node 解析报告：Node.js 是 lefthook/codelinter 的既定依赖，跨平台（含 Windows）一致
        error_count=$(node -e 'const d=JSON.parse(require("fs").readFileSync(process.argv[1],"utf8"));console.log(d.reduce((n,f)=>n+(f.messages||[]).filter(m=>m.severity==="error").length,0))' "$report")
        case "$error_count" in
          ''|*[!0-9]*)
            echo "❌ codelinter 报告解析失败：$report"
            exit 1
            ;;
        esac
        if [ "$error_count" -gt 0 ]; then
          echo "❌ ArkTS 静态检查发现 $error_count 个 error："
          node -e 'const d=JSON.parse(require("fs").readFileSync(process.argv[1],"utf8"));for(const f of d)for(const m of f.messages||[])if(m.severity==="error")console.log("  "+f.filePath+":"+m.line+":"+m.column+" ["+m.rule+"] "+m.message)' "$report"
          echo "如确需提交，使用 LEFTHOOK_EXCLUDE=ArkTS 静态检查 git commit 精确跳过"
          exit 1
        fi
        echo "✅ ArkTS 静态检查通过（0 error）"

    # --- Rust 格式检查 ---
    - name: Rust 格式检查
      glob: "localsend_ohrs/**/*.rs"
      exclude: "localsend_ohrs/third_party/**"
      run: |
        # 任一命令失败即整块失败：shell 默认以最后一条命令的退出码为准，
        # 否则主 crate 的失败会被 tests crate 的成功掩盖
        set -e
        if ! command -v cargo &>/dev/null; then
          echo "⚠️  cargo 未安装，跳过 Rust 检查"
          exit 0
        fi
        # 只格式检查，不修改文件（tests 为独立 crate，需分别指定 manifest）
        cargo fmt --manifest-path localsend_ohrs/Cargo.toml -- --check
        cargo fmt --manifest-path localsend_ohrs/tests/Cargo.toml -- --check

    # --- Rust Clippy ---
    - name: Rust Clippy
      glob: "localsend_ohrs/**/*.rs"
      exclude: "localsend_ohrs/third_party/**"
      run: |
        # 任一命令失败即整块失败：shell 默认以最后一条命令的退出码为准，
        # 否则主 crate 的失败会被 tests crate 的成功掩盖
        set -e
        if ! command -v cargo &>/dev/null; then
          echo "⚠️  cargo 未安装，跳过 Rust Clippy"
          exit 0
        fi
        # tests 为独立 crate，需分别指定 manifest
        cargo clippy --manifest-path localsend_ohrs/Cargo.toml -- -D warnings
        cargo clippy --manifest-path localsend_ohrs/tests/Cargo.toml -- -D warnings

    # --- NAPI 封装完整性校验 + 跨层事件契约校验 ---
    # 实现为 Rust 集成测试（tests/src/integration/napi_guard.rs），跨平台
    # （Windows/Mac/Linux 均可通过 cargo test 执行）。
    # 触发条件：NAPI 导出面（index.d.ts 由 Rust #[napi] 生成）、NativeBridge
    # 封装、NativeTypes 事件解析，或 guard 测试本身变化。
    - name: NAPI 封装完整性
      glob: "{localsend_ohrs/rust/napi/**,entry/src/main/ets/service/NativeBridge.ets,entry/src/main/ets/model/NativeTypes.ets,localsend_ohrs/tests/src/integration/napi_guard.rs}"
      run: cargo test --manifest-path localsend_ohrs/tests/Cargo.toml --target x86_64-unknown-linux-gnu integration::napi_guard

    # --- 设备端测试编译 ---
    # ArkTS 静态检查（codelinter）不做跨文件导出解析，"NAPI 封装完整性"也只
    # 覆盖 main 侧，因此 ohosTest 引用了不存在的导出时两者都不会报错。本 job
    # 以真实编译器补齐这一层：ohosTest 的 ArkTS 编译要求 NativeBridge /
    # NativeTypes 的导出与 ohosTest 的引用一致。
    # 该任务会连带构建 localsend_ohrs 的 native，首次或 native 改动后耗时较长，
    # 有增量产物时约数秒。
    - name: 设备端测试编译
      glob: "{entry/src/ohosTest/**,entry/src/main/ets/service/NativeBridge.ets,entry/src/main/ets/model/NativeTypes.ets}"
      run: |
        if ! command -v hvigorw &>/dev/null; then
          echo "⚠️  未找到 hvigorw，跳过设备端测试编译检查"
          exit 0
        fi
        hvigorw --mode module -p module=entry@ohosTest -p product=default assembleHap --daemon

# ============================================================
# commit-msg：提交信息格式校验
# ============================================================
commit-msg:
  jobs:
    - name: 约定式提交校验
      run: |
        if ! command -v commitlint &>/dev/null; then
          echo "⚠️  commitlint 未安装，跳过提交信息校验"
          echo "   安装：npm install -g @commitlint/cli @commitlint/config-conventional"
          exit 0
        fi
        commitlint --edit {1}
