# Lefthook 配置 — HandySend 项目 Git Hooks
# 文档：https://lefthook.dev/configuration/

# 确保远程仓库也安装 hooks（clone 后执行 lefthook install 即可）
remotes:
  - git_url: "origin"
    configs:
      - lefthook.yml

# ============================================================
# pre-commit：提交前检查（暂存文件级别）
# ============================================================
pre-commit:
  parallel: true
  jobs:
    # --- 大文件检测 ---
    - name: 大文件检测
      run: |
        max_size=512  # KB
        large_files=""
        for file in {staged_files}; do
          if [ -f "$file" ]; then
            size=$(du -k "$file" 2>/dev/null | cut -f1)
            if [ -n "$size" ] && [ "$size" -gt "$max_size" ]; then
              large_files="$large_files\n  $file (${size}KB)"
            fi
          fi
        done
        if [ -n "$large_files" ]; then
          echo "❌ 检测到大文件（>${max_size}KB）："
          echo -e "$large_files"
          echo "如确需提交，使用 LEFTHOOK=0 git commit 绕过"
          exit 1
        fi

    # --- 敏感信息扫描 ---
    - name: 敏感信息扫描
      run: |
        if ! command -v gitleaks &>/dev/null; then
          echo "⚠️  gitleaks 未安装，跳过敏感信息扫描"
          echo "   安装：https://github.com/gitleaks/gitleaks"
          exit 0
        fi
        # 不传 --config，让 gitleaks 自动发现项目根目录的 .gitleaks.toml
        # 传 --config 会替换默认规则集导致漏检
        gitleaks protect --staged

    # --- ArkTS 静态检查 ---
    - name: ArkTS 静态检查
      glob: "**/*.ets"
      run: |
        if ! command -v devecocli &>/dev/null; then
          echo "⚠️  devecocli 未安装，跳过 ArkTS 检查"
          exit 0
        fi
        devecocli check lint --incremental {staged_files}

    # --- Rust 格式检查 ---
    - name: Rust 格式检查
      glob: "localsend_ohrs/**/*.rs"
      exclude: "localsend_ohrs/third_party/**"
      run: |
        if ! command -v cargo &>/dev/null; then
          echo "⚠️  cargo 未安装，跳过 Rust 检查"
          exit 0
        fi
        # 只格式检查，不修改文件
        cargo fmt --manifest-path localsend_ohrs/Cargo.toml -- --check

    # --- Rust Clippy ---
    - name: Rust Clippy
      glob: "localsend_ohrs/**/*.rs"
      exclude: "localsend_ohrs/third_party/**"
      run: |
        if ! command -v cargo &>/dev/null; then
          echo "⚠️  cargo 未安装，跳过 Rust Clippy"
          exit 0
        fi
        cargo clippy --manifest-path localsend_ohrs/Cargo.toml -- -D warnings

# ============================================================
# commit-msg：提交信息格式校验
# ============================================================
commit-msg:
  jobs:
    - name: 约定式提交校验
      run: |
        if ! command -v commitlint &>/dev/null; then
          echo "⚠️  commitlint 未安装，跳过提交信息校验"
          echo "   安装：npm install -g @commitlint/cli @commitlint/config-conventional"
          exit 0
        fi
        commitlint --edit {1}
