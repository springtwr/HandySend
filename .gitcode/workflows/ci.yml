# .gitcode/workflows/ci.yml
# HandySend PR/push 检查流水线
# 触发条件：push 到 main / pull_request / 手动触发
# 检查项：ArkTS codelinter + Rust lint/test

name: CI 检查

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'LICENSE'
      - '.gitignore'
      - '.gitleaks.toml'
      - 'commitlint.config.js'
      - 'lefthook.yml'
      - '.env.example'
      - '.gitcode/ISSUE_TEMPLATE/**'
      - '.gitcode/PULL_REQUEST_TEMPLATE/**'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'LICENSE'
      - '.gitignore'
      - '.gitleaks.toml'
      - 'commitlint.config.js'
      - 'lefthook.yml'
      - '.env.example'
      - '.gitcode/ISSUE_TEMPLATE/**'
      - '.gitcode/PULL_REQUEST_TEMPLATE/**'
  workflow_dispatch:

concurrency:
  enable: true
  max: 2
  exceed-action: QUEUE

permissions: {}

jobs:
  # ── ArkTS 静态检查 ──
  # 镜像已预配 PATH / ohpm 仓库 / npm 仓库，无需额外配置
  arkts-lint:
    name: ArkTS CodeLinter
    runs-on: [ubuntu-latest, x64, small]
    container:
      image: springtwr/harmonyos-clt:26.0.0.821
      env:
        DEVECO_SDK_HOME: /opt/command-line-tools/sdk
    steps:
      - name: 检出代码
        uses: checkout
        with:
          submodules: true

      - name: 安装 ohpm 依赖
        run: |
          ohpm install --all
          cd entry && ohpm install && cd ..
          cd localsend_ohrs/package && ohpm install && cd ../..

      - name: 生成 CI 构建配置
        run: cp build-profile.example.json5 build-profile.json5

      - name: codelinter 检查
        run: codelinter -p default --exit-on error

  # ── Rust 格式与 Clippy 检查 ──
  rust-lint:
    name: Rust 格式与 Clippy 检查
    runs-on: [ubuntu-latest, x64, small]
    steps:
      - name: 检出代码
        uses: checkout
        with:
          submodules: true

      - name: 安装 Rust 工具链
        run: |
          rustup default stable
          rustup target add x86_64-unknown-linux-gnu

      - name: 缓存 cargo 注册表
        uses: cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-registry-${{ runner.os }}-${{ hashFiles('localsend_ohrs/Cargo.lock') }}
          restore-keys: |
            cargo-registry-${{ runner.os }}-

      - name: Rustfmt 检查
        working-directory: localsend_ohrs
        run: cargo fmt -- --check

      - name: Clippy 检查
        working-directory: localsend_ohrs
        run: cargo clippy -- -D warnings

  # ── Rust 桥接层单元测试 ──
  rust-unit-test:
    name: 桥接层单元测试
    runs-on: [ubuntu-latest, x64, small]
    needs: rust-lint
    steps:
      - name: 检出代码
        uses: checkout
        with:
          submodules: true

      - name: 安装 Rust 工具链
        run: |
          rustup default stable
          rustup target add x86_64-unknown-linux-gnu

      - name: 缓存 cargo 注册表与编译产物
        uses: cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            localsend_ohrs/target
          key: rust-unit-${{ runner.os }}-${{ hashFiles('localsend_ohrs/Cargo.lock') }}
          restore-keys: |
            rust-unit-${{ runner.os }}-

      - name: 运行单元测试
        working-directory: localsend_ohrs
        run: cargo test --target x86_64-unknown-linux-gnu --no-default-features --lib

  # ── Rust 桥接层集成测试 ──
  rust-integration-test:
    name: 桥接层集成测试
    runs-on: [ubuntu-latest, x64, small]
    needs: rust-lint
    steps:
      - name: 检出代码
        uses: checkout
        with:
          submodules: true

      - name: 安装 Rust 工具链
        run: |
          rustup default stable
          rustup target add x86_64-unknown-linux-gnu

      - name: 缓存 cargo 注册表与编译产物
        uses: cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            localsend_ohrs/tests/target
            localsend_ohrs/target
          key: rust-integration-${{ runner.os }}-${{ hashFiles('localsend_ohrs/Cargo.lock', 'localsend_ohrs/tests/Cargo.lock') }}
          restore-keys: |
            rust-integration-${{ runner.os }}-

      - name: 运行集成测试
        working-directory: localsend_ohrs/tests
        run: cargo test --target x86_64-unknown-linux-gnu

  # ── Rust 上游 localsend 测试 ──
  rust-upstream-test:
    name: 上游 localsend 测试
    runs-on: [ubuntu-latest, x64, medium]
    needs: rust-lint
    steps:
      - name: 检出代码
        uses: checkout
        with:
          submodules: true

      - name: 安装 Rust 工具链
        run: |
          rustup default stable
          rustup target add x86_64-unknown-linux-gnu

      - name: 缓存 cargo 注册表与编译产物
        uses: cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            localsend_ohrs/third_party/localsend/target
          key: rust-upstream-${{ runner.os }}-${{ hashFiles('localsend_ohrs/third_party/localsend/Cargo.lock') }}
          restore-keys: |
            rust-upstream-${{ runner.os }}-

      - name: 运行上游测试
        working-directory: localsend_ohrs/third_party/localsend
        run: cargo test --target x86_64-unknown-linux-gnu -p localsend --features crypto,discovery,http,multicast
