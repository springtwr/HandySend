# .gitcode/workflows/ci.yml
# HandySend PR/push 检查流水线
# 触发条件：push 到 main / pull_request / 手动触发
# 检查项：ArkTS codelinter + Rust lint/test

name: CI 检查

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'LICENSE'
      - '.gitignore'
      - '.gitleaks.toml'
      - 'commitlint.config.js'
      - 'lefthook.yml'
      - '.env.example'
      - '.gitcode/ISSUE_TEMPLATE/**'
      - '.gitcode/PULL_REQUEST_TEMPLATE/**'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'LICENSE'
      - '.gitignore'
      - '.gitleaks.toml'
      - 'commitlint.config.js'
      - 'lefthook.yml'
      - '.env.example'
      - '.gitcode/ISSUE_TEMPLATE/**'
      - '.gitcode/PULL_REQUEST_TEMPLATE/**'
  workflow_dispatch:

concurrency:
  enable: true
  max: 2
  exceed-action: QUEUE

permissions: {}

jobs:
  # ── ArkTS 静态检查 ──
  # 镜像已预配 PATH / ohpm 仓库 / npm 仓库，无需额外配置
  arkts-lint:
    name: ArkTS CodeLinter
    runs-on: [ubuntu-latest, x64, small]
    container:
      image: springtwr/harmonyos-clt:26.0.0.821
    steps:
      - name: 检出代码
        uses: checkout
        with:
          submodules: true

      - name: 安装 ohpm 依赖
        run: |
          ohpm install --all
          cd entry && ohpm install && cd ..
          cd localsend_ohrs/package && ohpm install && cd ../..

      - name: 生成 CI 构建配置
        run: cp build-profile.example.json5 build-profile.json5

      - name: codelinter 检查
        # codelinter 的 --exit-on（-e）在当前版本失效，检出 error 时退出码仍为 0，
        # 不依赖退出码判定，改为解析 json 报告统计 error 级别问题（与 lefthook pre-commit 同款方案）
        run: |
          report=./temp/code-linter-report.json
          mkdir -p ./temp
          rm -f "$report"
          lint_exit=0
          codelinter -p default -f json -o "$report" . || lint_exit=$?
          if [ ! -f "$report" ]; then
            echo "❌ codelinter 执行失败（退出码 $lint_exit），报告未生成"
            exit 1
          fi
          error_count=$(node -e 'const d=JSON.parse(require("fs").readFileSync(process.argv[1],"utf8"));console.log(d.reduce((n,f)=>n+(f.messages||[]).filter(m=>m.severity==="error").length,0))' "$report")
          case "$error_count" in
            ''|*[!0-9]*)
              echo "❌ codelinter 报告解析失败：$report"
              exit 1
              ;;
          esac
          if [ "$error_count" -gt 0 ]; then
            echo "❌ ArkTS 静态检查发现 $error_count 个 error："
            node -e 'const d=JSON.parse(require("fs").readFileSync(process.argv[1],"utf8"));for(const f of d)for(const m of f.messages||[])if(m.severity==="error")console.log("  "+f.filePath+":"+m.line+":"+m.column+" ["+m.rule+"] "+m.message)' "$report"
            exit 1
          fi
          echo "✅ ArkTS 静态检查通过（0 error）"

  # ── Rust 格式与 Clippy 检查 ──
  rust-lint:
    name: Rust 格式与 Clippy 检查
    runs-on: [ubuntu-latest, x64, small]
    steps:
      - name: 检出代码
        uses: checkout
        with:
          submodules: true

      - name: 安装 Rust 工具链
        run: |
          rustup default stable
          rustup target add x86_64-unknown-linux-gnu

      - name: 缓存 cargo 注册表
        uses: cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-registry-${{ runner.os }}-${{ hashFiles('localsend_ohrs/Cargo.lock') }}
          restore-keys: |
            cargo-registry-${{ runner.os }}-

      - name: Rustfmt 检查
        working-directory: localsend_ohrs
        # tests 为独立 crate，需分别指定 manifest
        run: |
          cargo fmt -- --check
          cargo fmt --manifest-path tests/Cargo.toml -- --check

      - name: Clippy 检查
        working-directory: localsend_ohrs
        # 标准 Runner 无 OHOS NDK，需指定 native target 并关闭 napi feature；
        # tests 为独立 crate（依赖 localsend_core 时已 default-features = false），需分别指定 manifest
        run: |
          cargo clippy --target x86_64-unknown-linux-gnu --no-default-features -- -D warnings
          cargo clippy --manifest-path tests/Cargo.toml --target x86_64-unknown-linux-gnu -- -D warnings

  # ── Rust 桥接层单元测试 ──
  rust-unit-test:
    name: 桥接层单元测试
    runs-on: [ubuntu-latest, x64, small]
    needs: rust-lint
    steps:
      - name: 检出代码
        uses: checkout
        with:
          submodules: true

      - name: 安装 Rust 工具链
        run: |
          rustup default stable
          rustup target add x86_64-unknown-linux-gnu

      - name: 缓存 cargo 注册表与编译产物
        uses: cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            localsend_ohrs/target
          key: rust-unit-${{ runner.os }}-${{ hashFiles('localsend_ohrs/Cargo.lock') }}
          restore-keys: |
            rust-unit-${{ runner.os }}-

      - name: 运行单元测试
        working-directory: localsend_ohrs
        run: cargo test --target x86_64-unknown-linux-gnu --no-default-features --lib

  # ── Rust 桥接层集成测试 ──
  rust-integration-test:
    name: 桥接层集成测试
    runs-on: [ubuntu-latest, x64, small]
    needs: rust-lint
    steps:
      - name: 检出代码
        uses: checkout
        with:
          submodules: true

      - name: 安装 Rust 工具链
        run: |
          rustup default stable
          rustup target add x86_64-unknown-linux-gnu

      - name: 缓存 cargo 注册表与编译产物
        uses: cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            localsend_ohrs/tests/target
            localsend_ohrs/target
          key: rust-integration-${{ runner.os }}-${{ hashFiles('localsend_ohrs/Cargo.lock', 'localsend_ohrs/tests/Cargo.lock') }}
          restore-keys: |
            rust-integration-${{ runner.os }}-

      - name: 运行集成测试
        working-directory: localsend_ohrs/tests
        run: cargo test --target x86_64-unknown-linux-gnu
