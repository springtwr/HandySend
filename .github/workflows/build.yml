# .github/workflows/build.yml
# HandySend 鸿蒙应用构建流水线（GitHub Actions）
# 仅在推送 v* tag 时触发，使用内置 CLT 的 Docker 镜像构建未签名包
# 构建成功后自动创建 GitHub Release 并附上产物

name: 鸿蒙应用构建

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  # ── 鸿蒙应用构建 ──
  # 镜像已预配 PATH / ohpm 仓库 / npm 仓库 / JDK 21，无需额外配置
  build:
    name: 构建鸿蒙应用
    runs-on: ubuntu-latest
    container:
      image: springtwr/harmonyos-clt:26.0.0.821
      env:
        OHOS_NDK_HOME: /opt/command-line-tools/sdk/default/openharmony
    # 创建 Release 并上传产物需要写权限
    permissions:
      contents: write
    timeout-minutes: 120
    steps:
      # ── 检出 ──
      - name: 检出代码
        uses: actions/checkout@v7
        with:
          submodules: true

      # ── Rust 交叉编译工具链 ──
      # 容器内无 Rust，需安装 ohrs 及 OHOS target 以编译 .so
      - name: 安装 Rust 交叉编译工具链
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          . "$HOME/.cargo/env"
          rustup target add aarch64-unknown-linux-ohos x86_64-unknown-linux-ohos
          cargo install ohrs
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      # ── CI 构建配置 ──
      - name: 生成 CI 构建配置
        run: cp build-profile.example.json5 build-profile.json5

      # ── 安装依赖 ──
      - name: 安装 ohpm 依赖
        run: |
          ohpm install --all
          cd entry && ohpm install && cd ..
          cd localsend_ohrs/package && ohpm install && cd ../..

      # ── 构建 ──
      # hvigor 26 起 project 模式不再暴露 HAP 模块任务，assembleHap 需模块模式调用
      - name: 构建应用
        run: |
          . "$HOME/.cargo/env"
          hvigorw assembleHap --mode module -p product=default -p buildMode=release --no-daemon

      # ── 上传构建产物 ──
      - name: 上传未签名 HAP
        uses: actions/upload-artifact@v7
        with:
          name: handy-send-unsigned-hap
          path: entry/build/default/outputs/default/entry-default-unsigned.hap

      # ── 发布 Release ──
      # 依据 tag 自动生成变更说明（两个 tag 间的提交记录），并附上未签名 HAP
      - name: 发布 GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: entry/build/default/outputs/default/entry-default-unsigned.hap
          generate_release_notes: true
