<!DOCTYPE html>
<!-- 平板端竖排布局模板：上方为标题/副标题文案区，下方为设备框区。
     画布尺寸、字体、文案内容、框图与屏幕区域位置均由渲染脚本在运行时注入。 -->
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="shared.css">
  <style>
    /* 平板端竖排：画布自上而下分为文案区与设备框区，比例适配 3:2 横向画布 */
    .canvas {
      flex-direction: column;
      padding: 64px 96px 56px;
    }

    /* 文案区：占画布上部，文字水平居中 */
    .text-zone {
      height: 300px;
      text-align: center;
      align-items: center;
    }

    .title {
      font-size: 68px;
    }

    .subtitle {
      margin-top: 24px;
      font-size: 42px;
    }

    /* 设备框区：占据文案区以下的全部剩余空间 */
    .frame-zone {
      flex: 1;
    }

    /* 框图作为定位元素且位于屏幕区域之后，保证边框叠在截图上方 */
    .frame-img {
      position: relative;
    }

    /* 特性图模式：隐藏设备框区，文案放大并居中占满画布 */
    .canvas.feature .frame-zone {
      display: none;
    }

    .canvas.feature .text-zone {
      flex: 1;
      height: auto;
    }

    /* 特性图元素尺寸：图标衬底、胶囊标签、放大后的标题与副标题间距 */
    .canvas.feature .feature-icon {
      width: 210px;
      height: 210px;
    }

    .canvas.feature .feature-tag {
      margin-top: 52px;
      padding: 13px 38px;
      font-size: 34px;
    }

    .canvas.feature .title {
      margin-top: 40px;
      font-size: 112px;
    }

    .canvas.feature .subtitle {
      margin-top: 28px;
      font-size: 60px;
    }
  </style>
</head>
<body>
  <div class="canvas">
    <div class="feature-decor">
      <div class="glow glow-a"></div>
      <div class="glow glow-b"></div>
      <div class="dots"></div>
    </div>
    <div class="text-zone">
      <div id="feature-icon" class="feature-icon"></div>
      <div id="feature-tag" class="feature-tag"></div>
      <div id="title" class="title"></div>
      <div id="subtitle" class="subtitle"></div>
    </div>
    <div class="frame-zone">
      <div id="screen" class="screen">
        <img id="raw-img" class="raw-img" alt="">
      </div>
      <img id="frame-img" class="frame-img" alt="">
    </div>
  </div>
</body>
</html>
